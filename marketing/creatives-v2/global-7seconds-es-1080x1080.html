<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>ResumeTailor — 7 Segundos (ES)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { display:flex; justify-content:center; align-items:center; background:#222; min-height:100vh; }
  .creative {
    position:relative; width:1080px; height:1080px; overflow:hidden;
    background:
      radial-gradient(1100px 700px at 78% -10%, rgba(99,102,241,.30), transparent 60%),
      radial-gradient(800px 600px at -10% 110%, rgba(79,70,229,.28), transparent 60%),
      #0b0b14;
    font-family:'Plus Jakarta Sans', sans-serif; color:#f8fafc;
  }
  .ticks { position:absolute; inset:0; opacity:.06;
    background-image:linear-gradient(90deg,#fff 1px,transparent 1px); background-size:36px 100%; }
  .pad { position:absolute; inset:0; padding:84px 84px 76px; display:flex; flex-direction:column; }
  .brand { display:flex; align-items:center; gap:14px; }
  .logo { width:46px; height:46px; border-radius:13px; background:linear-gradient(135deg,#6366f1,#4f46e5);
    display:flex; align-items:center; justify-content:center; font-weight:800; font-size:26px;
    box-shadow:0 10px 30px rgba(79,70,229,.55); }
  .brand b { font-size:25px; font-weight:800; letter-spacing:-.3px; }

  .dial-wrap { position:absolute; right:-120px; top:215px; width:620px; height:620px; }
  .dial { position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(#10b981 0deg 252deg, rgba(255,255,255,.07) 252deg 360deg);
    -webkit-mask:radial-gradient(transparent 207px, #000 209px); mask:radial-gradient(transparent 207px, #000 209px);
    filter:drop-shadow(0 0 60px rgba(16,185,129,.35)); }
  .dial-face { position:absolute; inset:64px; border-radius:50%;
    background:radial-gradient(circle at 50% 38%, #15151f, #0b0b14 70%);
    border:1px solid rgba(255,255,255,.08); box-shadow:inset 0 0 80px rgba(0,0,0,.6); }
  .marks { position:absolute; inset:64px; border-radius:50%; }
  .mark { position:absolute; left:50%; top:14px; width:3px; height:20px; background:rgba(255,255,255,.28);
    transform-origin:50% 232px; border-radius:2px; }
  .mark.big { height:30px; width:4px; background:rgba(255,255,255,.6); }
  .big7 { position:absolute; left:50%; top:50%; transform:translate(-50%,-54%);
    font-family:'Space Grotesk'; font-weight:700; font-size:248px; line-height:.8;
    background:linear-gradient(180deg,#fff,#a5b4fc); -webkit-background-clip:text; background-clip:text; color:transparent;
    text-shadow:0 0 40px rgba(99,102,241,.4); }
  .sec { position:absolute; left:50%; top:62%; transform:translate(-50%,0);
    font-family:'Space Grotesk'; font-weight:500; font-size:33px; letter-spacing:6px; color:#10b981; }
  .hand { position:absolute; left:50%; top:50%; width:5px; height:200px; background:#10b981;
    transform-origin:50% 100%; transform:translate(-50%,-100%) rotate(252deg);
    border-radius:5px; box-shadow:0 0 24px rgba(16,185,129,.8); }
  .pin { position:absolute; left:50%; top:50%; width:22px; height:22px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%); box-shadow:0 0 0 5px #10b981; }
  .crown { position:absolute; left:50%; top:-6px; transform:translate(-50%,0); width:46px; height:26px;
    border-radius:8px; background:linear-gradient(135deg,#6366f1,#4f46e5); }

  .kicker { margin-top:60px; display:inline-flex; align-items:center; gap:10px; align-self:flex-start;
    padding:11px 18px; border-radius:999px; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12);
    font-family:'Space Grotesk'; font-weight:500; font-size:18px; letter-spacing:1px; text-transform:uppercase; color:#c7d2fe; }
  .dot { width:9px; height:9px; border-radius:50%; background:#10b981; box-shadow:0 0 12px #10b981; }
  h1 { margin-top:30px; font-size:96px; line-height:.98; font-weight:800; letter-spacing:-3px; max-width:660px; }
  h1 .hl { color:#10b981; }
  .sub { margin-top:34px; font-size:30px; line-height:1.4; color:#cbd5e1; max-width:560px; font-weight:500; }
  .sub b { color:#fff; font-weight:700; }
  .footer { margin-top:auto; display:flex; align-items:flex-end; justify-content:space-between; }
  .cta { display:inline-flex; align-items:center; gap:14px; padding:26px 40px; border-radius:18px;
    background:linear-gradient(135deg,#6366f1,#4f46e5); font-size:29px; font-weight:800; letter-spacing:-.3px;
    box-shadow:0 18px 50px rgba(79,70,229,.55); }
  .price { text-align:right; }
  .price .big { font-family:'Space Grotesk'; font-weight:700; font-size:54px; }
  .price .lbl { font-size:19px; color:#94a3b8; letter-spacing:.5px; }
</style>
</head>
<body>
  <div class="creative">
    <div class="ticks"></div>
    <div class="dial-wrap">
      <div class="dial"></div>
      <div class="crown"></div>
      <div class="dial-face"></div>
      <div class="marks" id="marks"></div>
      <div class="big7">7</div>
      <div class="sec">SEGUNDOS</div>
      <div class="hand"></div>
      <div class="pin"></div>
    </div>

    <div class="pad">
      <div class="brand">
        <div class="logo">R</div>
        <b>ResumeTailor</b>
      </div>

      <div class="kicker"><span class="dot"></span> La prueba del primer vistazo</div>
      <h1>Tienes <span class="hl">7&nbsp;segundos</span> en la mesa del reclutador.</h1>
      <p class="sub">Es lo que dura el primer escaneo. Que cada línea cuente — <b>ajustado al puesto exacto</b> en ~30s.</p>

      <div class="footer">
        <div class="cta">Ajustar mi CV <span>→</span></div>
        <div class="price">
          <div class="big">$9</div>
          <div class="lbl">pago único · sin suscripción</div>
        </div>
      </div>
    </div>
  </div>
<script>
  var m=document.getElementById('marks');
  for(var i=0;i<60;i++){var d=document.createElement('div');d.className='mark'+(i%5===0?' big':'');d.style.transform='rotate('+(i*6)+'deg)';m.appendChild(d);}
</script>
</body>
</html>
