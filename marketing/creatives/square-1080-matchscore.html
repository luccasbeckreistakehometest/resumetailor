<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ResumeTailor — Match Score 1080x1080</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #e2e8f0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
  .creative {
    width: 1080px;
    height: 1080px;
    position: relative;
    overflow: hidden;
    background: radial-gradient(circle at 20% 0%, #ffffff 0%, #f8fafc 55%, #eef2ff 100%);
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    color: #0f172a;
    padding: 88px 80px;
    display: flex;
    flex-direction: column;
  }
  /* decorative blobs */
  .blob { position: absolute; border-radius: 50%; filter: blur(2px); opacity: .55; }
  .blob-a { width: 360px; height: 360px; right: -120px; top: -120px; background: radial-gradient(circle, #6366f1 0%, rgba(99,102,241,0) 70%); }
  .blob-b { width: 420px; height: 420px; left: -160px; bottom: -160px; background: radial-gradient(circle, #10b981 0%, rgba(16,185,129,0) 70%); opacity: .35; }

  .brand { display: flex; align-items: center; gap: 14px; z-index: 2; }
  .logo-mark {
    width: 52px; height: 52px; border-radius: 14px;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 10px 24px rgba(79,70,229,.35);
  }
  .logo-mark svg { width: 28px; height: 28px; }
  .brand-name { font-weight: 800; font-size: 30px; letter-spacing: -.5px; }
  .brand-name span { color: #4f46e5; }

  .headline { margin-top: 64px; z-index: 2; }
  .eyebrow {
    display: inline-block; font-size: 22px; font-weight: 700; color: #4f46e5;
    background: #eef2ff; padding: 10px 20px; border-radius: 999px; letter-spacing: .3px;
  }
  .headline h1 {
    font-size: 72px; line-height: 1.04; font-weight: 800; letter-spacing: -2px;
    margin-top: 28px; max-width: 880px;
  }
  .headline h1 em { font-style: normal; color: #4f46e5; }

  /* score showcase */
  .score-row {
    margin-top: 70px; display: flex; align-items: center; gap: 36px; z-index: 2;
  }
  .score-card {
    flex: 1; background: #ffffff; border-radius: 28px; padding: 38px 40px;
    box-shadow: 0 24px 60px rgba(15,23,42,.10); border: 1px solid #eef2ff;
  }
  .score-card.after { border: 2px solid #10b981; box-shadow: 0 28px 70px rgba(16,185,129,.22); }
  .score-label { font-size: 22px; font-weight: 600; color: #64748b; letter-spacing: .3px; }
  .score-num { font-size: 110px; font-weight: 800; line-height: 1; letter-spacing: -4px; margin-top: 6px; }
  .score-card.before .score-num { color: #94a3b8; }
  .score-card.after .score-num { color: #10b981; }
  .bar { height: 16px; border-radius: 999px; background: #e2e8f0; margin-top: 26px; overflow: hidden; }
  .bar > i { display: block; height: 100%; border-radius: 999px; }
  .before .bar > i { width: 38%; background: #94a3b8; }
  .after .bar > i { width: 91%; background: linear-gradient(90deg, #10b981, #34d399); }

  .arrow {
    width: 96px; height: 96px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #4f46e5, #6366f1);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 16px 36px rgba(79,70,229,.4);
  }
  .arrow svg { width: 46px; height: 46px; }

  .footer { margin-top: auto; display: flex; align-items: center; justify-content: space-between; z-index: 2; padding-top: 56px; }
  .deliverables { display: flex; gap: 14px; flex-wrap: wrap; max-width: 560px; }
  .chip {
    font-size: 21px; font-weight: 600; color: #0f172a; background: #ffffff;
    border: 1px solid #e2e8f0; padding: 14px 22px; border-radius: 14px;
    display: flex; align-items: center; gap: 10px; box-shadow: 0 6px 16px rgba(15,23,42,.05);
  }
  .chip b { color: #10b981; }
  .cta {
    background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff;
    font-weight: 700; font-size: 28px; padding: 26px 44px; border-radius: 18px;
    box-shadow: 0 18px 40px rgba(79,70,229,.4); white-space: nowrap; text-align: center;
  }
  .cta small { display: block; font-weight: 500; font-size: 18px; opacity: .85; margin-top: 4px; }
</style>
</head>
<body>
  <div class="creative">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>

    <div class="brand">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M6 3h8l4 4v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z" stroke="#fff" stroke-width="1.8"/>
          <path d="M13 3v5h5" stroke="#fff" stroke-width="1.8"/>
          <path d="M8.5 13.5l2.2 2.2 4.3-4.6" stroke="#34d399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="brand-name">Resume<span>Tailor</span></div>
    </div>

    <div class="headline">
      <span class="eyebrow">YOUR RESUME vs. THE JOB</span>
      <h1>Go from <em>"maybe"</em> to a&nbsp;perfect match.</h1>
    </div>

    <div class="score-row">
      <div class="score-card before">
        <div class="score-label">Match score before</div>
        <div class="score-num">38%</div>
        <div class="bar"><i></i></div>
      </div>
      <div class="arrow">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h13M13 6l6 6-6 6" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="score-card after">
        <div class="score-label">Match score after</div>
        <div class="score-num">91%</div>
        <div class="bar"><i></i></div>
      </div>
    </div>

    <div class="footer">
      <div class="deliverables">
        <div class="chip"><b>✓</b> Tailored resume</div>
        <div class="chip"><b>✓</b> Cover letter</div>
        <div class="chip"><b>✓</b> LinkedIn About</div>
      </div>
      <div class="cta">
        Tailor mine — $9
        <small>One time · ready in 30s</small>
      </div>
    </div>
  </div>
</body>
</html>
