<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!--
    ResumeTailor icon sprite (docs/DESIGN.md §7.4). No icon package: 28 marks we draw and own,
    plus two brand glyphs. Used as <svg><use href="/icons.svg#i20-check"/></svg>, or through
    <Icon> in components/ui/Icon.tsx.

    TWO OPTICAL SIZES, DRAWN SEPARATELY. The 20 set is on a 20 grid with a 2px margin and a 1.5px
    stroke; the 16 set is on a 16 grid with a 1.5px margin and a 1.25px stroke, with its geometry
    re-anchored to whole and half pixels rather than scaled down — a 20px drawing shrunk to 16
    thins its stroke to 1.2 and lands its anchors off-pixel, which is what makes an icon set look
    bought rather than made.

    The two brand marks are the documented exception: they are filled logos on a 24 grid, used at
    both sizes, because a logo is a shape and not a stroke.
  -->
  <defs>
    <style>
      symbol { fill: none; stroke: currentColor; stroke-linecap: round; stroke-linejoin: round; }
      symbol[id^="i20-"] { stroke-width: 1.5; }
      symbol[id^="i16-"] { stroke-width: 1.25; }
      .fill { fill: currentColor; stroke: none; }
    </style>
  </defs>

  <!-- ── 20px set ─────────────────────────────────────────────────────────── -->
